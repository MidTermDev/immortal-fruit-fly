; Immortal Fruit Fly — pebble firmware (see ../HARDWARE.md)
[platformio]
default_envs = cores3

[env]
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wno-unused-function
lib_ldf_mode = deep+

; M5Stack CoreS3 (ESP32-S3). Also builds for CoreS3 SE. Other M5 S3 boards: change `board`.
[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1
    ; arduinoWebSockets includes <WiFi.h> behind a #elif the dependency finder cannot evaluate: give its own
    ; sources the framework's WiFi headers directly
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src
lib_deps =
    m5stack/M5Unified@^0.2.5
    bblanchon/ArduinoJson@^7.2.0
    ricmoo/QRCode@^0.0.1
    links2004/WebSockets@^2.7.3
test_ignore = test_core, test_eth, test_rpc, test_host, test_screen

; Host build for the bit-exact core, the signer, the rpc wrappers, the brain-host frame parser and the screen
; renderer (no hardware needed): `pio test -e native`. ArduinoJson is the same library the pebble parses frames with;
; QRCode is the same encoder the screen uses (test_screen renders real QR codes into screens/*.ppm).
[env:native]
platform = native
build_flags = ${env.build_flags} -DNATIVE_TEST -O2
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    ricmoo/QRCode@^0.0.1
lib_compat_mode = off             ; QRCode's library.properties says "arduino"; it is plain C and builds natively
test_build_src = no
