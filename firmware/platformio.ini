; Immortal Fruit Fly — pebble firmware (see ../HARDWARE.md)
[platformio]
default_envs = cores3

[env]
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wno-unused-function
lib_ldf_mode = deep+

; M5Stack CoreS3 (ESP32-S3). Also builds for CoreS3 SE. Other M5 S3 boards: change `board`.
[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.5
    bblanchon/ArduinoJson@^7.2.0
    ricmoo/QRCode@^0.0.1
test_ignore = test_core, test_eth, test_rpc

; Host build for the bit-exact core and the signer (no hardware needed): `pio test -e native`
[env:native]
platform = native
build_flags = ${env.build_flags} -DNATIVE_TEST -O2
lib_deps =
test_build_src = no
